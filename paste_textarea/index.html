<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: sans-serif; color: #262730; }
  .label { font-size: 14px; margin: 0 0 6px 0; font-weight: 400; }
  .editor {
    width: 100%; height: 300px; overflow-y: auto; resize: vertical;
    border: 1px solid #c8cbd0; border-radius: 6px; background: #fff;
    padding: 10px 12px; font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere; outline: none;
  }
  .editor:focus { border-color: #ff4b4b; box-shadow: 0 0 0 1px #ff4b4b; }
  .editor:empty:before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; }
  .preview-wrap { display: inline-flex; position: relative; vertical-align: middle; margin: 6px 8px 6px 0; }
  .preview { display: block; max-width: 260px; max-height: 190px; border: 1px solid #ddd; border-radius: 6px; }
  .remove-image { position: absolute; right: 4px; top: 4px; border: 0; border-radius: 50%; width: 24px; height: 24px; background: #222; color: #fff; cursor: pointer; font-size: 16px; line-height: 20px; }
  .hint { color: #777; font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>
  <div class="label">카톡 주문 메시지 전체 복사/붙여넣기</div>
  <div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="여기에 카톡 메시지를 붙여넣거나 이미지를 Ctrl+V로 붙여넣으세요..."></div>
  <div class="hint">텍스트 또는 복사한 주문서 이미지를 이 입력칸에 바로 붙여넣을 수 있습니다. (Ctrl+V)</div>
<script>
(() => {
  const editor = document.getElementById('editor');
  let currentText = '';
  let currentImage = '';
  let initialized = false;

  function sendValue() {
    currentText = getTextWithoutImages();
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: 'streamlit:setComponentValue',
      value: { text: currentText, image_data: currentImage },
      dataType: 'json'
    }, '*');
  }

  function getTextWithoutImages() {
    const clone = editor.cloneNode(true);
    clone.querySelectorAll('.preview-wrap, img, button').forEach(el => el.remove());
    return (clone.innerText || clone.textContent || '').replace(/\u00a0/g, ' ').replace(/\n+$/, '');
  }

  function addImagePreview(dataUrl) {
    currentImage = dataUrl;
    const old = editor.querySelector('.preview-wrap');
    if (old) old.remove();
    const wrap = document.createElement('span');
    wrap.className = 'preview-wrap';
    wrap.contentEditable = 'false';
    const img = document.createElement('img');
    img.className = 'preview';
    img.src = dataUrl;
    img.alt = '붙여넣은 주문서 이미지';
    const remove = document.createElement('button');
    remove.className = 'remove-image';
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = '이미지 제거';
    remove.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      wrap.remove();
      currentImage = '';
      sendValue();
    });
    wrap.appendChild(img);
    wrap.appendChild(remove);
    editor.appendChild(document.createElement('br'));
    editor.appendChild(wrap);
  }

  
  function setEditorFromValue(value) {
    if (initialized) return;

    const text = value && typeof value.text === 'string'
      ? value.text : '';
    const image = value && typeof value.image_data === 'string'
      ? value.image_data : '';

    editor.innerHTML = '';

    if (text) {
      editor.appendChild(document.createTextNode(text));
    }

    currentText = text;
    currentImage = '';

    if (image) {
      addImagePreview(image);
    }

    initialized = true;
  }


  editor.addEventListener('input', () => sendValue());
  
  editor.addEventListener('paste', (event) => {
    const clipboard = event.clipboardData;
    if (!clipboard) return;

    let imageFile = null;

    // 1. 클립보드 항목에서 이미지 찾기
    if (clipboard.items) {
      for (const item of clipboard.items) {
        if (item.type && item.type.startsWith('image/')) {
          imageFile = item.getAsFile();
          if (imageFile) break;
        }
      }
    }

    // 2. 항목에서 못 찾으면 클립보드 파일 목록 확인
    if (!imageFile && clipboard.files) {
      for (const file of clipboard.files) {
        if (file.type && file.type.startsWith('image/')) {
          imageFile = file;
          break;
        }
      }
    }

    // 이미지가 없으면 일반 텍스트를 서식 없이 붙여넣어 줄바꿈이 중복되는 현상 방지
    if (!imageFile) {
      const plainText = clipboard.getData('text/plain');
      if (!plainText) return;

      event.preventDefault();

      const selection = window.getSelection();
      if (selection && selection.rangeCount > 0 &&
          editor.contains(selection.anchorNode)) {
        const range = selection.getRangeAt(0);
        range.deleteContents();

        const textNode = document.createTextNode(plainText);
        range.insertNode(textNode);

        range.setStartAfter(textNode);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      } else {
        editor.appendChild(document.createTextNode(plainText));
      }

      sendValue();
      return;
    }

    event.preventDefault();

    const reader = new FileReader();

    reader.onload = () => {
      const dataUrl = String(reader.result || '');

      if (!dataUrl.startsWith('data:image/')) {
        console.error('붙여넣은 파일이 이미지 형식이 아닙니다.');
        return;
      }

      addImagePreview(dataUrl);
      sendValue();
    };

    reader.onerror = () => {
      console.error('이미지 클립보드 읽기에 실패했습니다.');
    };

    reader.readAsDataURL(imageFile);
  });


  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'streamlit:render') return;
    const args = data.args || {};
    setEditorFromValue(args.value || args.default || {text: '', image_data: ''});
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: 370}, '*');
  });

  window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1}, '*');
  window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: 370}, '*');
})();
</script>
</body>
</html>
